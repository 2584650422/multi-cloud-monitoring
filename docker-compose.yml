services:
  tencent-cloud-network-exporter:
    build:
      context: ./exporters/tencent-cloud-network-exporter
      # 此监控机的默认 Docker bridge 网络无法访问外部 DNS；仅构建期复用
      # 宿主机网络，以便 pip 解析并下载依赖。运行期 network_mode 也为 host。
      network: host
    image: local/tencent-cloud-network-exporter:0.1.0
    container_name: tencent-cloud-network-exporter
    hostname: tencent-cloud-network-exporter
    restart: unless-stopped
    network_mode: host
    env_file:
      # 本地执行 docker compose config 时允许不存在；生产启动前必须创建，
      # 否则 exporter 会因缺少凭据主动退出。
      - path: /data/docker/monitoring/tencent-cloud-network-exporter/.env
        required: false
    volumes:
      - type: bind
        source: /data/docker/monitoring/tencent-cloud-network-exporter/config.yml
        # 保留旧的容器内路径，兼容已构建的生产镜像；运行目录和容器名仍为 Tencent 专用。
        target: /etc/cloud-network-exporter/config.yml
        read_only: true
        bind:
          create_host_path: false
          selinux: Z
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: prometheus
    hostname: prometheus
    restart: unless-stopped
    network_mode: host
    user: "65534:65534"
    depends_on:
      - alertmanager
    volumes:
      - type: bind
        source: /data/docker/monitoring/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind:
          create_host_path: false
          selinux: Z
      - /data/docker/monitoring/prometheus/rules:/etc/prometheus/rules:ro,Z
      - /data/docker/monitoring/prometheus/targets:/etc/prometheus/targets:ro,Z
      - /data/docker/monitoring/prometheus/data:/prometheus:Z
      # 宿主机时区；Prometheus、Alertmanager、Grafana 三项服务均需保留
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: false
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=127.0.0.1:9090
      - --web.enable-lifecycle
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: alertmanager
    hostname: alertmanager
    restart: unless-stopped
    network_mode: host
    user: "65534:65534"
    volumes:
      - type: bind
        source: /data/docker/monitoring/alertmanager/alertmanager.yml
        target: /etc/alertmanager/alertmanager.yml
        read_only: true
        bind:
          create_host_path: false
          selinux: Z
      - type: bind
        source: /data/docker/monitoring/alertmanager/templates
        target: /etc/alertmanager/templates
        read_only: true
        bind:
          create_host_path: false
          selinux: Z
      - /data/docker/monitoring/alertmanager/data:/alertmanager:Z
      # 宿主机时区；邮件时间仍由模板使用 tz/date 显式转换为北京时间
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: false
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=127.0.0.1:9093
      - --web.enable-lifecycle
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  grafana:
    image: grafana/grafana:13.2.0
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    network_mode: host
    user: "472:0"
    depends_on:
      - prometheus
    environment:
      GF_PATHS_CONFIG: /etc/grafana/grafana.ini
      GF_PATHS_DATA: /var/lib/grafana
      GF_PATHS_LOGS: /var/log/grafana
      GF_PATHS_PLUGINS: /var/lib/grafana/plugins
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - type: bind
        source: /data/docker/monitoring/grafana/grafana.ini
        target: /etc/grafana/grafana.ini
        read_only: true
        bind:
          create_host_path: false
          selinux: Z
      - /data/docker/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro,Z
      - /data/docker/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro,Z
      - /data/docker/monitoring/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro,Z
      - /data/docker/monitoring/grafana/provisioning/plugins:/etc/grafana/provisioning/plugins:ro,Z
      - /data/docker/monitoring/grafana/data:/var/lib/grafana:Z
      - /data/docker/monitoring/grafana/logs:/var/log/grafana:Z
      # 宿主机时区；与 Prometheus、Alertmanager 保持一致
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
