global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: tencent-node
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/tencent-node.yml
        refresh_interval: 1m
